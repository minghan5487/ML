name: 每日訓練

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/cache@v4
        with:
          path: models/model.joblib
          key: model-${{ github.run_id }}
          restore-keys: model-

      - run: pip install -r requirements.txt

      - run: python -m trend.train --force

      - name: 提交訓練結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models reports
          git diff --cached --quiet || git commit -m "每日訓練 $(date +%F)"
          git push
