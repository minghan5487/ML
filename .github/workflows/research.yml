name: 研究：波動度模型與含成本回測

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 下載資料（含籌碼、融資券、月營收）
        run: python -m trend.data 2>&1 | tee download.log

      - name: 資料覆蓋率
        run: |
          {
            echo '## 資料覆蓋率'
            echo
            echo '```text'
            for d in prices valuation chip margin revenue; do
              echo "$d: $(ls -1 data/$d 2>/dev/null | wc -l) 檔"
            done
            echo
            echo '--- 零位元組或極小的檔案 ---'
            find data -name '*.csv' -size -3c -print || echo '（無）'
            echo
            echo '--- FinMind 取數結果 ---'
            grep -E '^\[(估值|籌碼|融資券|月營收)\]' download.log || echo '（無統計行）'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 波動度方向模型
        run: |
          {
            echo '## 波動度方向模型'
            echo
            echo '```text'
            python -m trend.vol 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 含成本回測
        run: |
          {
            echo '## 含成本回測'
            echo
            echo '```text'
            python -m trend.backtest 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # 三次 run 的回測年化報酬在 +21.2% ~ +24.5% 之間跳動，但管線已驗證為確定性
      # （同一份檔案跑兩次，特徵矩陣雜湊與 AUC 完全一致）。
      # 若上游資料會改寫歷史值，就是唯一剩下的解釋。在同一個 job 內
      # 相隔數分鐘重新下載並比對雜湊，可直接驗證。已證實：252 檔中 50 檔改變。
      - name: 上游資料穩定性
        run: |
          {
            echo '## 上游資料穩定性'
            echo
            echo '```text'
            find data -name '*.csv' | sort | xargs sha256sum > fp1.txt
            python -c "from trend.data import update_all; update_all(force=True)" > /dev/null 2>&1
            find data -name '*.csv' | sort | xargs sha256sum > fp2.txt
            n=$(diff fp1.txt fp2.txt | grep -c '^<' || true)
            echo "檔案總數: $(wc -l < fp1.txt)"
            echo "內容改變的檔案數: $n"
            if [ "$n" -eq 0 ]; then
              echo '→ 兩次下載完全一致，資料改寫不是差異來源，需另尋解釋。'
            else
              echo '→ 上游在數分鐘內改寫了歷史值。筆數不變、內容變，'
              echo '  足以讓前 10 名換人並改變回測報酬。'
              echo
              echo '改變的檔案（前 15 個）：'
              diff fp1.txt fp2.txt | grep '^<' | awk '{print $3}' | head -15
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 保留報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: warn
