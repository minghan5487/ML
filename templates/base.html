<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}台股走勢預測{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f4f6f9; font-family: system-ui, "Microsoft JhengHei", sans-serif; }
        .navbar-brand { font-weight: 700; }
        .card { border: 0; border-radius: 14px; box-shadow: 0 2px 12px rgba(20, 30, 50, .06); }
        .stat-label { font-size: .8rem; color: #868e96; }
        .stat-value { font-size: 1.6rem; font-weight: 700; }
        .up { color: #e03131; }
        .down { color: #2f9e44; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}"><i class="bi bi-diagram-3 me-2"></i>台股走勢預測</a>
        <div class="navbar-nav">
            <a class="nav-link {{ 'active' if request.endpoint == 'home' }}" href="{{ url_for('home') }}">20 日走勢</a>
            <a class="nav-link {{ 'active' if request.endpoint in ('regression', 'predict') }}" href="{{ url_for('regression') }}">隔日價格</a>
        </div>
    </div>
</nav>
<main class="container pb-5">
    {% block content %}{% endblock %}
</main>
</body>
</html>
