{% extends 'base.html' %}

{% block title %}{{ symbol }} 預測結果{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">{{ symbol }} 預測結果</h1>
    <a href="{{ url_for('home') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-repeat me-1"></i>重新預測</a>
</div>

<div class="row g-3 mb-4">
    {% for label, value in [('R² Score', r2), ('MSE', mse), ('漲跌方向準確率', direction_acc), ('訓練 / 測試筆數', n_train ~ ' / ' ~ n_test)] %}
    <div class="col-6 col-lg-3">
        <div class="card p-3 h-100">
            <div class="stat-label">{{ label }}</div>
            <div class="stat-value">{{ value }}</div>
        </div>
    </div>
    {% endfor %}
</div>

<div class="card p-3">
    <img src="{{ image_url }}" alt="{{ symbol }} 預測圖" class="img-fluid">
</div>
{% endblock %}
