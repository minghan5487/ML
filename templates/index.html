<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>股票走勢預測</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  </head>
  <body class="bg-light">
    <div class="container py-5" style="max-width: 560px;">
      <h1 class="h3 mb-4">🌳 股票走勢預測</h1>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form action="/predict" method="post" class="card card-body shadow-sm">
        <div class="form-group">
          <label for="stock_symbol">股票代碼</label>
          <input type="text" class="form-control" id="stock_symbol" name="stock_symbol" placeholder="例如 2330.TW" required>
          <small class="form-text text-muted">台股請加 .TW（上市）或 .TWO（上櫃）</small>
        </div>
        <div class="form-group">
          <label for="years">回溯年數</label>
          <input type="number" class="form-control" id="years" name="years" min="1" max="20" value="3" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">預測</button>
      </form>
    </div>
  </body>
</html>
